name: release

# Every push to master: derive the next version from Conventional Commits,
# write it into CHANGELOG.md *with chgl itself*, commit and tag, then build the
# platform binaries. A docs-only push tags nothing.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.cut.outputs.released }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A token that can push the tag back, so the release commit is real.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: zig build -Doptimize=ReleaseSafe

      - name: Commit identity
        shell: bash
        run: |
          # Must be set before chgl commits, or the commit has no author.
          git config user.name "chgl release bot"
          git config user.email "chgl@users.noreply.github.com"

      - name: Cut the release with chgl
        id: cut
        shell: bash
        run: |
          set +e
          ./zig-out/bin/chgl --write --commit --create-tag --bump-version
          code=$?
          set -e
          case "$code" in
            0)
              git push origin HEAD --follow-tags
              echo "released=true" >> "$GITHUB_OUTPUT"
              ;;
            3)
              # Nothing releasable: no tag, no binaries, no release.
              echo "nothing to release"
              echo "released=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "chgl failed with exit $code"
              exit "$code"
              ;;
          esac

      - name: Report the tag
        id: tag
        shell: bash
        run: echo "version=$(git tag --points-at HEAD | grep -E '^v[0-9]' | tail -1)" >> "$GITHUB_OUTPUT"
        if: steps.cut.outputs.released == 'true'

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-macos
            os: macos-latest
            name: macos-aarch64
          - target: x86_64-windows
            os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version || github.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.version }}"
          out="chgl-${tag}-${{ matrix.name }}"
          ext=; [ "${{ matrix.os }}" = "windows-latest" ] && ext=.exe
          mkdir -p dist
          cp "zig-out/bin/chgl${ext}" "dist/$out"
          # sha256sum is GNU-only, shasum is macOS, certutil is Windows.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$out" > "$out.sha256")
          elif command -v shasum >/dev/null; then
            (cd dist && shasum -a 256 "$out" > "$out.sha256")
          else
            (cd dist && certutil -hashfile "$out" SHA256 | sed -n 2p | tr -d ' \r' > "$out.sha256.sum" \
              && awk '{print $1"  ${{ matrix.name }}}' "$out.sha256.sum" > "$out.sha256" && rm "$out.sha256.sum")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # checkout first: it cleans the workspace, which would delete artifacts
      # downloaded before it.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release body is the changelog section
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.version }}"
          version="${tag#v}"
          awk -v want="## [$version]" '
            $0 ~ want { inside = 1 }
            inside && NR > 1 && /^## \[/ && $0 !~ want { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $version" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
