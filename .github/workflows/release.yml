name: release

# Every push to master: derive the next version from Conventional Commits, write
# it into CHANGELOG.md *with chgl itself*, commit and tag, then build the
# binaries. A docs-only push tags nothing.
#
# Preconditions are checked before anything is written. A release that commits
# and tags and only then discovers it cannot push leaves the branch and the tag
# in a state nobody can reproduce, so the order here is deliberate:
#   1. can we push at all?
#   2. is there anything to release?
#   3. only then write, commit, tag, push.
#
# Requires (repository settings, not this file):
#   Settings > Actions > General > Workflow permissions:
#     "Read and write permissions"   (default is read-only, which cannot push)
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.cut.outputs.released }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the release boundary, so the whole history is required.
          fetch-depth: 0
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check the token can push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "chgl release bot"
          git config user.email "chgl@users.noreply.github.com"
          # `git push --dry-run` reports a permission problem without moving
          # anything. Doing this first means a read-only token fails here, with
          # an actionable message, instead of after a commit and a tag exist.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push --dry-run origin HEAD:refs/heads/master 2>/tmp/push.err; then
            echo "::error::cannot push to master. Set Settings > Actions > General > Workflow permissions to 'Read and write permissions', or give this workflow a token with contents:write."
            sed 's/ghs_[A-Za-z0-9_]*/***/' /tmp/push.err
            exit 1
          fi

      - run: zig build -Doptimize=ReleaseSafe

      - name: Cut the release with chgl
        id: cut
        run: |
          set +e
          ./zig-out/bin/chgl --write --commit --create-tag --bump-version
          code=$?
          set -e
          case "$code" in
            0)
              tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | tail -1)
              # The tag must exist before the push, or `--follow-tags` sends
              # nothing and the next run sees no release boundary again.
              git push origin HEAD --follow-tags
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "version=$tag" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "nothing releasable in this push; no tag, no release"
              echo "released=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::chgl exited $code"
              exit "$code"
              ;;
          esac

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-macos
            os: macos-latest
            name: macos-aarch64
          - target: x86_64-windows
            os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.version }}"
          out="chgl-${tag}-${{ matrix.name }}"
          ext=; [ "${{ matrix.os }}" = "windows-latest" ] && ext=.exe
          mkdir -p dist
          cp "zig-out/bin/chgl${ext}" "dist/$out"
          # sha256sum is GNU-only, shasum is macOS, certutil is Windows.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$out" > "$out.sha256")
          elif command -v shasum >/dev/null; then
            (cd dist && shasum -a 256 "$out" > "$out.sha256")
          else
            (cd dist && certutil -hashfile "$out" SHA256 | sed -n 2p | tr -d ' \r' > sum.txt \
              && awk '{print $1"  '"$out"'}' sum.txt > "$out.sha256" && rm sum.txt)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout first: it cleans the workspace, which would delete artifacts
      # downloaded before it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release body is the changelog section
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.version }}"
          version="${tag#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { inside = 1 }
            inside && /^## \[/ && index($0, want) != 1 { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $version" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
